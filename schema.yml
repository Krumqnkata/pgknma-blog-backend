      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
          description: ''
  /api/my-content/comments/{id}/delete/:
    delete:
      operationId: my_content_comments_delete_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - my-content
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/my-content/memes/:
    get:
      operationId: my_content_memes_list
      tags:
      - my-content
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemeOfWeek'
          description: ''
  /api/my-content/memes/{id}/delete/:
    delete:
      operationId: my_content_memes_delete_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - my-content
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/my-content/songs/:
    get:
      operationId: my_content_songs_list
      tags:
      - my-content
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BellSongSuggestion'
          description: ''
  /api/my-content/songs/{id}/delete/:
    delete:
      operationId: my_content_songs_delete_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - my-content
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/notifications/:
    get:
      operationId: notifications_list
      tags:
      - notifications
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/poll/statistics/:
    get:
      operationId: poll_statistics_retrieve
      tags:
      - poll
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollStatistics'
          description: ''
  /api/poll/status/:
    get:
      operationId: poll_status_retrieve
      tags:
      - poll
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPollStatus'
          description: ''
  /api/poll/submit/:
    post:
      operationId: poll_submit_create
      tags:
      - poll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollAnswer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PollAnswer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PollAnswer'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollAnswer'
          description: ''
  /api/posts/:
    get:
      operationId: posts_list
      tags:
      - posts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
          description: ''
  /api/posts/{id}/:
    get:
      operationId: posts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Публикация.
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
          description: ''
  /api/posts/{post_pk}/comments/:
    get:
      operationId: posts_comments_list
      parameters:
      - in: path
        name: post_pk
        schema:
          type: integer
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
          description: ''
  /api/posts/{post_pk}/comments/add/:
    post:
      operationId: posts_comments_add_create
      parameters:
      - in: path
        name: post_pk
        schema:
          type: integer
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/privacy-policy/:
    get:
      operationId: privacy_policy_retrieve
      tags:
      - privacy-policy
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyPolicy'
          description: ''
  /api/profile/export/:
    get:
      operationId: profile_personal_data_export
      description: 'Генерира UTF-8 JSON файл с профилните данни, създаденото съдържание,
        отговорите, съгласията и историята на входовете, които са пряко свързани с
        текущия Django потребител. Не включва парола, password hash, JWT/refresh token-и
        или чужди записи. Отговорът е attachment и е маркиран с `Cache-Control: no-store`.'
      summary: Изтегляне на личните данни на текущия потребител
      tags:
      - Профил – лични данни
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalDataExportSchema'
              examples:
                СъкратенПример:
                  value:
                    format_version: '1.0'
                    scope: pgknma-blog
                    generated_at: '2026-08-01T10:30:00+03:00'
                    account:
                      id: 14
                      username: example-user
                      email: user@example.com
                    created_content:
                      comments: []
                    activity:
                      poll_answers: []
                    privacy_and_security:
                      login_sessions: []
                    excluded_for_security:
                    - password and password hash
                    notes: []
                  summary: Съкратен пример
          description: JSON файл с личните данни на текущия потребител.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Липсващ, изтекъл или прекратен JWT token.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Надвишен дневен лимит за експортиране.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Сайтът е в режим на поддръжка.
  /api/profile/sessions/:
    get:
      operationId: profile_session_history
      description: Връща до 100 собствени сесии в рамките на настроения срок за съхранение.
        Полето `status` е `active`, `expired` или `revoked`, а `is_current` показва
        сесията, с която е изпратена заявката. Изисква валиден JWT Bearer access token.
      summary: История на сесиите на текущия потребител
      tags:
      - Профил – сесии
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlogLoginSession'
              examples:
                АктивнаСесия:
                  value:
                  - id: 22c7a26f-31de-48d7-b175-cdb37e49e264
                    auth_method: google
                    auth_method_display: Google
                    ip_address: 203.0.113.10
                    network_operator: Example Network
                    network_asn: 64500
                    device_label: Firefox · Windows
                    created_at: '2026-08-01T10:00:00+03:00'
                    last_seen_at: '2026-08-01T10:15:00+03:00'
                    expires_at: '2026-08-08T10:00:00+03:00'
                    revoked_at: null
                    revoked_reason: ''
                    revoked_reason_display: ''
                    status: active
                    is_current: true
                  summary: Активна сесия
          description: Списък със собствените сесии, подредени от най-новата.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Липсващ, изтекъл или прекратен JWT token.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Надвишен лимит на заявките.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Сайтът е в режим на поддръжка.
  /api/profile/sessions/{session_id}/revoke/:
    post:
      operationId: profile_session_revoke
      description: Прекратява собствена сесия по UUID. Текущата сесия не може да бъде
        прекратена от този endpoint; за нея се използва изходът от профила. Операцията
        е идемпотентна за вече прекратена сесия.
      summary: Прекратяване на една друга сесия
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        description: UUID на собствената сесия за прекратяване.
        required: true
      tags:
      - Профил – сесии
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
              examples:
                УспешноПрекратяване:
                  value:
                    detail: Сесията е прекратена успешно.
                  summary: Успешно прекратяване
          description: Сесията е прекратена или вече е била прекратена.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Направен е опит за прекратяване на текущата сесия.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Липсващ, изтекъл или прекратен JWT token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Сесията не съществува или принадлежи на друг потребител.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Надвишен лимит за управление на сесии.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Сайтът е в режим на поддръжка.
  /api/profile/sessions/revoke-others/:
    post:
      operationId: profile_sessions_revoke_others
      description: Прекратява всички активни сесии на текущия потребител без сесията,
        с която е изпратена заявката.
      summary: Прекратяване на всички други активни сесии
      tags:
      - Профил – сесии
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogSessionRevokeOthersResponse'
              examples:
                ПрекратениДвеСесии:
                  value:
                    detail: Всички други активни сесии са прекратени.
                    revoked_count: 2
                  summary: Прекратени две сесии
          description: Операцията е изпълнена успешно.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Текущата server-side сесия не може да бъде разпозната.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Липсващ, изтекъл или прекратен JWT token.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Надвишен лимит за управление на сесии.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailResponse'
          description: Сайтът е в режим на поддръжка.
  /api/program/:
