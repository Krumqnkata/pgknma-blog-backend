        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Changelog'
          description: ''
  /api/consent/:
    post:
      operationId: consent_create
      tags:
      - consent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRecord'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentRecord'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentRecord'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
          description: ''
  /api/contact/:
    post:
      operationId: contact_create
      tags:
      - contact
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/events/:
    get:
      operationId: events_list
      tags:
      - events
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          description: ''
  /api/memes/:
    get:
      operationId: memes_list
      tags:
      - memes
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemeOfWeek'
          description: ''
    post:
      operationId: memes_create
      tags:
      - memes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemeOfWeek'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemeOfWeek'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemeOfWeek'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemeOfWeek'
          description: ''
  /api/memes/{id}/:
    get:
      operationId: memes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Меме на седмицата.
        required: true
      tags:
      - memes
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemeOfWeek'
          description: ''
  /api/memes/{id}/image/:
    get:
      operationId: memes_image_retrieve
      description: Serve meme files without exposing pending uploads through MEDIA_URL.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - memes
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/memes/{id}/vote/:
    post:
      operationId: memes_vote_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - memes
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/my-content/comments/:
