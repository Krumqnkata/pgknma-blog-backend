          description: Позволява на потребителите да предлагат песни за училищния
            звънец.
        enable_weekly_poll:
          type: boolean
          title: Активирана 'Седмична анкета'
          description: Активира/деактивира показването на седмичната анкета на сайта.
        enable_meme_of_the_week:
          type: boolean
          title: Активирано 'Меме на седмицата'
          description: Позволява на потребителите да качват и гласуват за мемета.
        enable_user_registration:
          type: boolean
          title: Активирани 'Регистрации на потребители'
          description: Позволява на нови потребители да се регистрират в системата.
        enable_program_page:
          type: boolean
          title: Активирана страница 'Програма'
          description: Показва или скрива страницата с учебната програма.
    SlotEnum:
      enum:
      - startClass
      - endClass
      - beforeLunch
      - afterLunch
      - morning
      - special
      type: string
      description: |-
        * `startClass` - Начало на час
        * `endClass` - Край на час
        * `beforeLunch` - Преди голямо междучасие
        * `afterLunch` - След голямо междучасие
        * `morning` - Сутрешен звънец
        * `special` - Специален повод
    StatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Чакащо одобрение
        * `approved` - Одобрено
        * `rejected` - Отхвърлено
    TermsOfService:
      type: object
      properties:
        content:
          type: string
          description: Пълният текст на Условията за ползване. Поддържа се Markdown.
        date:
          type: string
          format: date-time
          readOnly: true
          description: 'Дата на последната промяна. Формат: YYYY-MM-DD HH:MM:SS.'
      required:
      - content
      - date
    UserPollStatus:
      type: object
      properties:
        is_locked:
          type: boolean
        unlocks_at:
          type: string
          format: date-time
          nullable: true
        last_result:
          nullable: true
        question:
          allOf:
          - $ref: '#/components/schemas/PollQuestion'
          nullable: true
      required:
      - is_locked
      - last_result
      - question
      - unlocks_at
    UsernameChange:
      type: object
      properties:
        current_password:
          type: string
        new_username:
          type: string
          pattern: ^[\w.@+-]+$
          maxLength: 150
      required:
      - current_password
      - new_username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access token, издаден при вход. Формат на header-а: `Authorization:
        Bearer <access-token>`.'
