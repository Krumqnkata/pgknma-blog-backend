openapi: 3.0.3
info:
  title: PGKNMA API
  version: 1.0.0
  description: Вътрешна документация на API-то. Достъпна е само за superuser.
paths:
  /api/approved-songs/:
    get:
      operationId: approved_songs_list
      tags:
      - approved-songs
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BellSongSuggestion'
          description: ''
  /api/auth/check-username/:
    get:
      operationId: auth_check_username_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
