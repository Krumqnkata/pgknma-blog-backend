      operationId: bell_song_suggestions_submit_create
      tags:
      - bell-song-suggestions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BellSongSuggestion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BellSongSuggestion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BellSongSuggestion'
