{% load static %}
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логин</title>
    <link rel="stylesheet" href="{% static 'valentines/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="icon" href="{% static 'valentines/favicon.ico' %}" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div id="form-container">
            <header>
                <img src="{% static 'valentines/logo.png' %}" alt="School Logo" class="school-logo">
                <h1>Онлайн валентинки 💌</h1>
                <p>Въведи кода за достъп, за да изпращаш и получаваш валентинки.</p>
            </header>
            <form id="valentine-form" method="POST">
              {% csrf_token %}
                <div class="form-group">
                    <label for="code">Код за достъп</label>
                    <input type="text" id="code" name="code", maxlength=6 required>
                    {% if error_message %}
                      <p class="error" style="color: red;">{{ error_message }}</p>
                    {% endif %}
                </div>
                <button type="submit">Провери</button>
                <button type="button" id="guide-button-login" style="margin-top: 10px;">Прочети ръководството</button>
            <div style="background-color: #fff1f2; border: 2px solid #db2777; padding: 30px; border-radius: 30px; text-align: center; margin-top: 20px;"><p style="font-family: sans-serif; color: #9d174d; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem;">ВКЛЮЧИ СЕ В КОНКУРСА ТУК:</p><a href="https://docs.google.com/forms/d/e/1FAIpQLSdE6CPBpdH46HsJXVp9FK5lThN0cOtxPhwA0fdv6qX48QjfbQ/viewform" style="display: inline-block; background-color: #db2777; color: #ffffff; padding: 18px 45px; text-decoration: none; font-family: sans-serif; font-size: 1.5rem; border-radius: 50px; font-weight: bold; box-shadow: 0 6px 15px rgba(219, 39, 119, 0.4);">КЪМ КОНКУРСА</a></div>
            </form>
	     <a href="/" style="display: block; text-align: center; margin-top: 20px; font-family: var(--font-body); color: #fff; text-decoration: none; font-size: 0.9rem; opacity: 0.7;">Към блога</a>
        </div>
    </div>
    <script src="{% static 'valentines/script.js' %}"></script>
    <script src="{% static 'valentines/background-animation.js' %}"></script>
</body>
</html>
