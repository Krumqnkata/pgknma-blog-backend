<!-- templates/admin/site_settings_change_form.html -->
{% extends "admin/change_form.html" %}

{% block field_sets %}
    {{ block.super }}

    {% if can_cleanup %}
        <div class="ux-notice ux-notice-info">
            <span class="material-symbols-outlined" aria-hidden="true">cleaning_services</span>
            Изтриването на стари мемета, предложения за песни и анкети е на отделна страница:
            <a href="{% url 'admin:blog_sitesettings_cleanup' %}">Почистване на записи</a>.
        </div>
    {% endif %}
{% endblock %}
