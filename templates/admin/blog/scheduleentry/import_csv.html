{% extends "admin/base_site.html" %}

{% block content %}
  <div id="content-main">
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {{ form.non_field_errors }}
      <fieldset class="module aligned">
        {% for field in form %}
          <div class="form-row">
            <div>
              {{ field.errors }}
              {{ field.label_tag }}
              {{ field }}
              {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
            </div>
          </div>
        {% endfor %}
      </fieldset>
      <div class="submit-row">
        <input type="submit" value="Импортирай и замени програмата" class="default">
        <a href="{% url 'admin:blog_scheduleentry_changelist' %}" class="button cancel-link">Отказ</a>
      </div>
    </form>
  </div>
{% endblock %}
